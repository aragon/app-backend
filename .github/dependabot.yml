version: 2
updates:
  - package-ecosystem: "yarn"
    directory: "/" # Location of package.json and yarn.lock
    schedule:
      interval: "weekly" # Can be "daily", "weekly", or "monthly"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "cristianizzo"
      - "ccir105" # Added second reviewer
    assignees:
      - "cristianizzo"
      - "ccir105" # Added second assignee
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
