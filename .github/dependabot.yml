version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package.json and yarn.lock
    schedule:
      interval: "weekly" # Can be "daily", "weekly", or "monthly"
    labels:
      - "dependencies"
    reviewers:
      - "cristianizzo"
      - "ccir105"
    assignees:
      - "cristianizzo"
      - "ccir105"
    commit-message:
      prefix: "chore"
      include: "scope"
