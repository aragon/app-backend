name: "Setup pnpm"
description: "Installs pnpm (version pinned via the packageManager field), sets up Node from .nvmrc with pnpm cache and installs the dependencies."

inputs:
  install:
    description: "Whether to install the dependencies"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
