name: "Setup pnpm"
description: "Installs pnpm (version pinned via the packageManager field), sets up Node from .nvmrc with pnpm cache and installs the dependencies."

inputs:
  install:
    description: "Whether to install the dependencies"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        run_install: false

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
