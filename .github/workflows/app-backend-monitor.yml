name: AppBackend API Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch:
    inputs:
      discordWebhookUrl:
        description: 'Discord Webhook URL'
        required: true
        type: string
  push:
    branches:
      - feature/monitor # Trigger on this branch only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Performance Tests Only
        id: postman-test
        run: |
          # Run Newman tests and save output
          newman run postman/postman-backend-collection.json \
            --env-var "host=https://api.aragon-backend.com" \
            --reporters cli \
            --timeout-request 5000 \
            > test-output.log || true

          # Display test output for debugging
          echo "===== Newman Test Output ====="
          cat test-output.log
          echo "=============================="

          # Extract the summary section
          NOTIFICATION_SECTION=$(awk '/GET https:\/\/api.aragon-backend.com/,/┌─────────────────────────/' test-output.log | sed '$d')
          if [ -z "$NOTIFICATION_SECTION" ]; then
            echo "NOTIFICATION_SECTION=None" >> $GITHUB_ENV
          else
            SANITIZED_SECTION=$(echo "$NOTIFICATION_SECTION" | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "NOTIFICATION_SECTION=$SANITIZED_SECTION" >> $GITHUB_ENV
          fi

          # Extract full details of failures
          RAW_FAILURES=$(awk '/#  failure/{flag=1; next} /==============================/{flag=0} flag' test-output.log)
          if [ -z "$RAW_FAILURES" ]; then
            echo "FAILURES=None" >> $GITHUB_ENV
          else
            SANITIZED_FAILURES=$(echo "$RAW_FAILURES" | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "FAILURES=$SANITIZED_FAILURES" >> $GITHUB_ENV
          fi

          # Determine test status
          if [ -z "$RAW_FAILURES" ]; then
            echo "TEST_STATUS=success" >> $GITHUB_ENV
          else
            echo "TEST_STATUS=failed" >> $GITHUB_ENV
          fi

      - name: Notify Discord
        run: |
          if [ "${{ env.TEST_STATUS }}" == "failed" ]; then
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"❌ **Postman Performance Test Failed**\\n**Summary:**\\n${{ env.NOTIFICATION_SECTION }}\\n**Failing Tests:**\\n${{ env.FAILURES }}\"}" \
              https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M
          else
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"✅ **Postman Performance Test Succeeded**\\n**Summary:**\\n${{ env.NOTIFICATION_SECTION }}\"}" \
              https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M
          fi
