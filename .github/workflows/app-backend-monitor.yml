name: AppBackend API Monitoring

on:
  schedule:
    - cron: '0 * * * *' # Run performance tests every hour
    - cron: '0 0 * * 1' # Send success message every Monday at 00:00
  workflow_dispatch:

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        host:
          - 'https://api.aragon-backend.com'
          - 'https://stg.backend.aragon.in'
          - 'https://backend.aragon.in'
          - 'https://dev.backend.aragon.in'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Performance Tests
        id: postman-test
        run: |
          newman run postman/postman-backend-collection.json \
            --env-var "host=${{ matrix.host }}" \
            --reporters cli \
            --timeout-request 5000 \
            > test-output.log || true

      - name: Upload Test Report
        id: upload_report
        uses: actions/upload-artifact@v3
        with:
          name: test-output-log-${{ matrix.host }}
          path: test-output.log

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          echo "Sending Discord failure notification..."
          cat <<EOF > payload.json
          {
            "embeds": [{
              "title": "❌ API Monitoring Test Failed",
              "color": 15158332,
              "fields": [
                { "name": "Repository", "value": "${{ github.repository }}", "inline": false },
                { "name": "Workflow", "value": "${{ github.workflow }}", "inline": false },
                { "name": "Branch", "value": "${{ github.ref }}", "inline": false },
                { "name": "Environment", "value": "${{ matrix.host }}", "inline": false },
                { "name": "Artifact Download URL", "value": "[Download Test Report]($ARTIFACT_URL)", "inline": false },
                { "name": "Details", "value": "[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false }
              ],
              "timestamp": "$(date --utc +%FT%TZ)"
            }]
          }
          EOF

          curl -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK_URL
          echo "Discord notification sent."

      - name: Cleanup Temporary Files
        run: rm -rf ./node_modules ./build ./tmp

  weekly_success:
    if: github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord Weekly Success Message
        run: |
          echo "Sending Discord weekly success notification..."
          cat <<EOF > payload.json
          {
            "embeds": [{
              "title": "✅ Weekly Report: All API Monitoring Tests Succeeded!",
              "color": 3066993,
              "fields": [
                { "name": "Repository", "value": "${{ github.repository }}", "inline": false },
                { "name": "Workflow", "value": "${{ github.workflow }}", "inline": false },
                { "name": "Branch", "value": "${{ github.ref }}", "inline": false },
                { "name": "Details", "value": "[View Workflow Runs](${{ github.server_url }}/${{ github.repository }}/actions)", "inline": false }
              ],
              "timestamp": "$(date --utc +%FT%TZ)"
            }]
          }
          EOF

          curl -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK_URL
          echo "Discord weekly success notification sent."
