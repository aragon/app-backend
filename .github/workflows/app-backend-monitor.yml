name: AppBackend API Monitoring

on:
  schedule:
    - cron: '0 * * * *' # Run performance tests every hour
    - cron: '0 0 * * 1' # Send success message every Monday at 00:00
  workflow_dispatch:

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Performance Tests
        id: postman-test
        run: |
          set -e
          newman run postman/postman-backend-collection.json \
            --env-var "host=https://api.aragon-backend.com" \
            --reporters cli \
            --timeout-request 5000 \
            > test-output.log

          RAW_FAILURES=$(awk '/#  failure/{flag=1; next} /==============================/{flag=0} flag' test-output.log)
          if [ -z "$RAW_FAILURES" ]; then
            echo "TEST_STATUS=success" >> $GITHUB_ENV
            echo "FAILURES=None" >> $GITHUB_ENV
          else
            SANITIZED_FAILURES=$(echo "$RAW_FAILURES" | sed ':a;N;$!ba;s/\\n/\\\\n/g' | sed 's/\"/\\\\\"/g')
            echo "TEST_STATUS=failed" >> $GITHUB_ENV
            echo "FAILURES=$SANITIZED_FAILURES" >> $GITHUB_ENV
            exit 1
          fi

      - name: Notify Discord on Failure
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$TEST_STATUS" == "failed" ]; then
            echo "Sending Discord failure notification..."
            cat <<EOF > payload.json
            {
              "embeds": [{
                "title": "❌ API Monitoring Test Failed",
                "color": 15158332,
                "fields": [
                  { "name": "Repository", "value": "${{ github.repository }}", "inline": false },
                  { "name": "Workflow", "value": "${{ github.workflow }}", "inline": false },
                  { "name": "Branch", "value": "${{ github.ref }}", "inline": false },
                  { "name": "Details", "value": "[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false },
                  { "name": "Failures", "value": "$FAILURES", "inline": false }
                ],
                "timestamp": "$(date --utc +%FT%TZ)"
              }]
            }
            EOF

            curl -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK_URL
            echo "Discord notification sent."
          fi

      - name: Cleanup temporary files
        run: rm -f test-output.log payload.json

  weekly_success:
    if: github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord Weekly Success Message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Sending weekly success notification..."
          cat <<EOF > payload.json
          {
            "embeds": [{
              "title": "✅ Weekly Report",
              "color": 3066993,
              "fields": [
                { "name": "Message", "value": "All API Monitoring Tests Succeeded!", "inline": false },
                { "name": "Details", "value": "[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false }
              ],
              "timestamp": "$(date --utc +%FT%TZ)"
            }]
          }
          EOF

          curl -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK_URL
          echo "Discord notification sent."

      - name: Cleanup temporary files
        run: rm -f payload.json
