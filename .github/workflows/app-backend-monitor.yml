name: AppBackend API Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch:
    inputs:
      discordWebhookUrl:
        description: 'Discord Webhook URL'
        required: true
        type: string
  push:
    branches:
      - feature/monitor # Trigger on this branch only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Performance Tests Only
        id: postman-test
        run: |
          # Run Newman tests and save output
          newman run postman/postman-backend-collection.json \
            --env-var "host=https://api.aragon-backend.com" \
            --reporters cli \
            --timeout-request 5000 \
            > test-output.log

          # Display test output for debugging
          echo "===== Newman Test Output ====="
          cat test-output.log
          echo "=============================="

          # Safely store output in GitHub Actions environment
          echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
          cat test-output.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Check for failures
          if grep -q "failure" test-output.log; then
            echo "Performance tests failed!"
            exit 1
          fi

      - name: Notify Discord on Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ github.event.inputs.discordWebhookUrl }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"✅ **Postman Performance Test Succeeded**\n\`\`\`${{ env.TEST_OUTPUT }}\`\`\`\"}" \
            https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ github.event.inputs.discordWebhookUrl }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"❌ **Postman Performance Test Failed**\n\`\`\`${{ env.TEST_OUTPUT }}\`\`\`\"}" \
            https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M
