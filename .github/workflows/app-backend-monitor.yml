name: AppBackend API Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch:
    inputs:
      discordWebhookUrl:
        description: 'Discord Webhook URL'
        required: true
        type: string
  push:
    branches:
      - feature/monitor # Trigger on this branch only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Performance Tests Only
        id: postman-test
        run: |
          # Run Newman tests and save output
          newman run postman/postman-backend-collection.json \
            --env-var "host=https://api.aragon-backend.com/non-existent" \
            --reporters cli \
            --timeout-request 5000 \
            > test-output.log

          # Display test output for debugging
          echo "===== Newman Test Output ====="
          cat test-output.log
          echo "=============================="

          # Extract failing tests
          FAILURES=$(grep -A 2 "✗" test-output.log | sed 's/^/• /')
          if [ -z "$FAILURES" ]; then
            echo "FAILURES=None" >> $GITHUB_ENV
          else
            echo "FAILURES=$FAILURES" >> $GITHUB_ENV
          fi

          # Exit with failure if any tests failed
          if grep -q "✗" test-output.log; then
            echo "Performance tests failed!"
            exit 1
          fi

      - name: Notify Discord on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content": "✅ **Postman Performance Test Succeeded**"}' \
            https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M

      - name: Notify Discord on Failure
        if: failure()
        run: |
          if [ "$FAILURES" == "None" ]; then
            FAILURES_MESSAGE="No detailed failure messages were found."
          else
            FAILURES_MESSAGE="$FAILURES"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"❌ **Postman Performance Test Failed**\n**Failing Tests:**\n$FAILURES_MESSAGE\"}" \
            https://discord.com/api/webhooks/1309183202719699084/7iigCapTmyIHtgkqcLfXY9j557T_YChm7bv9h-BBU37ZhPDIIZYt34Z0KkqQGCBGic1M
