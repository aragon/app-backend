name: Sandbox Sync Development

on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: sandbox-label-merge
  queue: max
  cancel-in-progress: false

jobs:
  sync-development:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          GPG_PASSPHRASE: op://kv_backend2_infra/arabot-1_SIGN_CERTS/credential
          GPG_PRIVATE_KEY: op://kv_backend2_infra/arabot-1_SIGN_CERTS/private_key
          GITHUB_RELEASE_TOKEN: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential

      - name: Checkout sandbox
        uses: actions/checkout@v7
        with:
          token: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          ref: sandbox
          fetch-depth: 0

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ steps.secrets.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Merge development into sandbox
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          DEVELOPMENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEVELOPMENT_SHA"
          BEFORE=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short "$DEVELOPMENT_SHA")
          if ! git merge --no-ff -m "Merge development ($SHORT_SHA) into sandbox" "$DEVELOPMENT_SHA"; then
            git merge --abort
            PR_NUMBER=$(gh api "repos/$GH_REPO/commits/$DEVELOPMENT_SHA/pulls" --jq '.[0].number // empty')
            if [[ -n "$PR_NUMBER" ]]; then
              gh pr comment "$PR_NUMBER" --body "Development no longer merges cleanly into sandbox, nothing changed. Merge development into sandbox by hand."
            fi
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$BEFORE" ]]; then
            git push origin sandbox
          fi
