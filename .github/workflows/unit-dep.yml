name: Unit Dep Test
on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'development'
      - 'main'

permissions:
  contents: read

jobs:
  unit-dep-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: unit-dep (${{ matrix.shard }})
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set variables
        id: set-variables
        run: |
          echo "OP_SERVER_USERNAME=op://apikeys_nonprod/backend2_server_dev/username" >> $GITHUB_ENV
          echo "OP_SERVER_URL=op://apikeys_nonprod/backend2_server_dev/URL" >> $GITHUB_ENV
          echo "OP_SERVER_CERT=op://apikeys_nonprod/backend2_server_dev/deploy_backend2_dev" >> $GITHUB_ENV

      - name: Load secrets
        id: op-server-secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 #v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP }}
          SERVER_USERNAME: ${{ env.OP_SERVER_USERNAME }}
          SERVER_URL: ${{ env.OP_SERVER_URL }}

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 #v4.1.0

      - name: Download certfile
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP }}
          SERVER_CERT: ${{ env.OP_SERVER_CERT }}
        run: |
          mkdir ~/.ssh/ -p
          op read ${{ env.SERVER_CERT }} > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Download config files
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_TEMP }}
        run: |
          ls
          op item get "configs_unit_dep" --vault temporal_backend2 --format json | jq -r '.fields[] | select(.value != null) | .value' > temp_env
          cat temp_env >> test/test.env

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build & run unit-dep tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          docker compose -f docker-compose-test.yml up \
            --exit-code-from unit-dep \
            --abort-on-container-exit \
            --build unit-dep

      - name: Teardown containers
        run: |
          docker compose -f docker-compose-test.yml down

  unit-dep:
    runs-on: ubuntu-latest
    needs: [unit-dep-shard]
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.unit-dep-shard.result }}" = "success"
