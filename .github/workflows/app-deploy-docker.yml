name: Docker Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
          - sandbox
          - development
          - staging
          - production
      branch:
        description: 'Source branch (defaults to current branch)'
        required: false
        type: string
  push:
    branches:
      - feat/app-deply-docker  # Temporary for testing, remove when done

env:
  # Global configuration
  DEPLOYMENT_USER: 'deploy'
  DEPLOYMENT_PATH: '~/app-backend-deploy'
  ARCHIVE_NAME: 'deploy.tar.gz'

jobs:
  # Validate deployment request
  validate:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
      branch: ${{ steps.validate.outputs.branch }}
    steps:
      - name: Validate deployment parameters
        id: validate
        run: |
          # Determine branch to deploy
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          # TEMP TO REMOVE!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          if [[ -z "$ENVIRONMENT" ]]; then
            ENVIRONMENT="sandbox"
            echo "⚠️  No environment specified, using default: sandbox"
          fi
          
          # Production deployments must be from main/master branch
          if [[ "$ENVIRONMENT" == "production" && "$BRANCH" != "main" ]]; then
            echo "❌ Production deployments must be from main branch"
            echo "   Requested branch: $BRANCH"
            exit 1
          fi
          
          echo "✅ Validation passed"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  # Main deployment job
  deploy:
    name: Deploy to ${{ needs.validate.outputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ needs.validate.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.validate.outputs.environment }}
      cancel-in-progress: false

    steps:
      # Step 1: Configure deployment environment
      - name: Configure deployment environment
        id: configure
        run: |
          ENVIRONMENT="${{ needs.validate.outputs.environment }}"
          
          # Map environment names to deployment codes
          declare -A ENV_MAP=(
            ["production"]="prod"
            ["staging"]="stg"
            ["development"]="dev"
            ["sandbox"]="sand"
          )
          
          DEPLOY_ENV="${ENV_MAP[$ENVIRONMENT]}"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # Set 1Password configuration based on environment
          if [[ "$ENVIRONMENT" == "production" ]]; then
            OP_VAULT="apikeys_production"
            echo "OP_VAULT=apikeys_production" >> $GITHUB_ENV
            echo "OP_SERVICE_ACCOUNT_SERVERS=OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP" >> $GITHUB_ENV
          else
            OP_VAULT="apikeys_nonprod"
            echo "OP_VAULT=apikeys_nonprod" >> $GITHUB_ENV
            echo "OP_SERVICE_ACCOUNT_SERVERS=OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP" >> $GITHUB_ENV
          fi
          
          echo "OP_SERVICE_ACCOUNT_CONFIGS=OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_TEMP" >> $GITHUB_ENV
          
          # Set server configuration paths - use $OP_VAULT not ${{ env.OP_VAULT }}
          echo "OP_SERVER_USERNAME=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/username" >> $GITHUB_ENV
          echo "OP_SERVER_URL=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/URL" >> $GITHUB_ENV
          echo "OP_SERVER_CERT=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/deploy_backend2_${DEPLOY_ENV}" >> $GITHUB_ENV
          
          echo "📋 Deployment Configuration:"
          echo "   Environment: $ENVIRONMENT"
          echo "   Deploy Code: $DEPLOY_ENV"
          echo "   Branch: ${{ needs.validate.outputs.branch }}"

      # Step 2: Install required tools
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      # Step 3: Load server connection secrets
      - name: Load server connection secrets
        id: server-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[env.OP_SERVICE_ACCOUNT_SERVERS] }}
          SERVER_USERNAME: ${{ env.OP_SERVER_USERNAME }}
          SERVER_URL: ${{ env.OP_SERVER_URL }}

      # Step 4: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.branch }}
          fetch-depth: 0  # Full history for better debugging

      # Step 5: Setup SSH authentication
      - name: Setup SSH authentication
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[env.OP_SERVICE_ACCOUNT_SERVERS] }}
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Download SSH private key
          op read "${{ env.OP_SERVER_CERT }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Configure SSH
          cat > ~/.ssh/config <<EOF
          Host deployment-server
            HostName ${{ steps.server-secrets.outputs.SERVER_URL }}
            User ${{ steps.server-secrets.outputs.SERVER_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          
          # Test SSH connection
          ssh deployment-server "echo '✅ SSH connection established'"

      # Step 6: Download application configurations
      - name: Download application configurations
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[env.OP_SERVICE_ACCOUNT_CONFIGS] }}
        run: |
          echo "📥 Downloading configuration files..."
          
          # Create scripts to handle config downloads
          cat > download_configs.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          VAULT="temporal_backend2"
          ITEM="configs_app_backend2_$DEPLOY_ENV"
          
          # Download application configs
          echo "📄 Downloading application configurations..."
          op item get --vault "$VAULT" "$ITEM" --format json | \
            jq -r '.fields.[].label' | sed 1d | \
            while IFS= read -r config_name; do
              echo "  - Processing: $config_name"
          
              # Download config content
              op item get --vault "$VAULT" "$ITEM" --fields "$config_name" | \
                sed '1s/^"//;$s/"$//' > temp_config
          
              # Split semicolon-separated configs
              IFS=';' read -ra CONFIGS <<< "$config_name"
              for conf in "${CONFIGS[@]}"; do
                CONFIG_FILE=".env.$conf-$DEPLOY_ENV"
                cp temp_config "$CONFIG_FILE"
          
                # Update environment-specific values
                case "$DEPLOY_ENV" in
                  prod)  LOGZIO_ENV="PRODUCTION" ;;
                  stg)   LOGZIO_ENV="STAGING" ;;
                  sand)  LOGZIO_ENV="SANDBOX" ;;
                  *)     LOGZIO_ENV="DEVELOPMENT" ;;
                esac
          
                sed -i "s/^LOGZIO_SERVER_NAME=.*/LOGZIO_SERVER_NAME=${conf^^}-${LOGZIO_ENV}/" "$CONFIG_FILE"
                echo "    ✓ Created $CONFIG_FILE ($(sha256sum "$CONFIG_FILE" | cut -d' ' -f1 | head -c 8))"
              done
          
              rm temp_config
            done
          
          # Download Docker configuration
          echo "📄 Downloading Docker configuration..."
          op item get --vault "$VAULT" "configs_docker" --fields "docker-config" | \
            sed '1s/^"//;$s/"$//' > .env.docker
          
          if [[ ! -s .env.docker ]]; then
            echo "❌ ERROR: Docker configuration not found"
            exit 1
          fi
          
          echo "✅ Configuration download complete"
          SCRIPT
          
          chmod +x download_configs.sh
          ./download_configs.sh

      # Step 7: Create deployment package
      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          
          # List files to be deployed
          echo "📋 Files to be deployed:"
          find . -name ".env*" -type f | sort
          echo "---"
          find scripts -name "*.sh" -type f | sort
          
          # Create deployment archive
          cd ..
          tar -czf "${{ env.ARCHIVE_NAME }}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.log' \
            "${{ github.event.repository.name }}"
          
          # Verify archive
          echo "📊 Archive contents summary:"
          tar -tzf "${{ env.ARCHIVE_NAME }}" | grep -E "(\.env|\.sh$)" | wc -l
          echo "files included"
          
          # Calculate checksum
          CHECKSUM=$(sha256sum "${{ env.ARCHIVE_NAME }}" | cut -d' ' -f1)
          echo "DEPLOYMENT_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "✅ Package created: $CHECKSUM"

      # Step 8: Deploy to server
      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment to ${{ needs.validate.outputs.environment }}..."
          
          # Transfer deployment package
          echo "📤 Transferring deployment package..."
          scp ../"${{ env.ARCHIVE_NAME }}" deployment-server:~/
          
          # Execute deployment script
          echo "🔧 Executing deployment..."
          ssh deployment-server << 'DEPLOY_SCRIPT'
          set -euo pipefail
          
          # Deployment configuration
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          DEPLOYMENT_PATH="${{ env.DEPLOYMENT_PATH }}"
          ARCHIVE_NAME="${{ env.ARCHIVE_NAME }}"
          EXPECTED_CHECKSUM="${{ env.DEPLOYMENT_CHECKSUM }}"
          
          # Verify package integrity
          echo "🔍 Verifying package integrity..."
          ACTUAL_CHECKSUM=$(sha256sum ~/"$ARCHIVE_NAME" | cut -d' ' -f1)
          if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
            echo "❌ Checksum mismatch! Deployment aborted."
            exit 1
          fi
          
          # Backup current deployment (if exists)
          if [[ -d "$DEPLOYMENT_PATH" ]]; then
            echo "📦 Creating backup of current deployment..."
            BACKUP_NAME="app-backend-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
            tar -czf ~/"$BACKUP_NAME" -C ~ "$(basename "$DEPLOYMENT_PATH")"
            echo "✅ Backup created: $BACKUP_NAME"
          fi
          
          # Extract new deployment
          echo "📂 Extracting deployment package..."
          tar -xzf ~/"$ARCHIVE_NAME"
          rm ~/"$ARCHIVE_NAME"
          
          # Replace old deployment
          rm -rf "$DEPLOYMENT_PATH"
          mv ~/"${{ github.event.repository.name }}" "$DEPLOYMENT_PATH"
          
          # Setup deployment
          cd "$DEPLOYMENT_PATH"
          chmod +x scripts/*.sh
          
          # Ensure Docker networks exist
          echo "🌐 Configuring Docker networks..."
          docker network create internal-net 2>/dev/null || true
          docker network create public-net 2>/dev/null || true
          
          # Execute deployment
          echo "🎯 Running deployment script for environment: $DEPLOY_ENV"
          export ENV_SUFFIX="$DEPLOY_ENV"
          export DEPLOY_ENV="$DEPLOY_ENV"
          
          # Run deployment with timeout
          timeout 1800 bash scripts/app-deploy.sh "$ENV_SUFFIX" || {
            echo "❌ Deployment timed out after 30 minutes"
            exit 1
          }
          
          echo "✅ Deployment completed successfully!"
          
          # Cleanup old backups (keep last 5)
          echo "🧹 Cleaning up old backups..."
          ls -t ~/app-backend-backup-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          
          DEPLOY_SCRIPT

      # Step 9: Verify deployment health
      - name: Verify deployment health
        run: |
          echo "🏥 Verifying deployment health..."
          
          # Basic health check
          ssh deployment-server << 'HEALTH_CHECK'
          set -euo pipefail
          
          cd "${{ env.DEPLOYMENT_PATH }}"
          
          # Check if containers are running
          echo "🐳 Checking Docker containers..."
          docker ps --filter "label=app=backend2" --filter "status=running" --format "table {{.Names}}\t{{.Status}}"
          
          # Add more health checks as needed
          echo "✅ Health check passed"
          HEALTH_CHECK

      # Step 10: Cleanup sensitive data
      - name: Cleanup sensitive data
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive data..."
          
          # Remove SSH keys and configs
          rm -rf ~/.ssh/deploy_key ~/.ssh/config
          
          # Remove configuration files
          rm -f .env* download_configs.sh
          
          # Clear environment variables
          unset OP_SERVICE_ACCOUNT_TOKEN
          
          echo "✅ Cleanup complete"

      # Step 11: Send deployment notification
      - name: Send deployment notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ENVIRONMENT="${{ needs.validate.outputs.environment }}"
          BRANCH="${{ needs.validate.outputs.branch }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [[ "$STATUS" == "success" ]]; then
            echo "✅ Deployment successful!"
            echo "📋 Summary:"
            echo "   Environment: $ENVIRONMENT"
            echo "   Branch: $BRANCH"
            echo "   Deployed by: $ACTOR"
            echo "   Details: $RUN_URL"
          else
            echo "❌ Deployment failed!"
            echo "📋 Summary:"
            echo "   Environment: $ENVIRONMENT"
            echo "   Branch: $BRANCH"
            echo "   Attempted by: $ACTOR"
            echo "   Details: $RUN_URL"
          fi

  # Run E2E tests after deployment
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: success()

    steps:
      - name: Trigger E2E test suite
        uses: aragon/app-qa/.github/actions/dispatch@main
        with:
          opToken: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP }}
          environment: ${{ env.DEPLOY_ENV }}

      - name: Report E2E test status
        run: |
          echo "🧪 E2E tests triggered for ${{ needs.validate.outputs.environment }} environment"
