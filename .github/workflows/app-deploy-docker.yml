name: Docker Deployment
run-name: Docker deployment to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment server'
        required: true
        type: choice
        options:
          - sandbox
          - development
          - staging
          - production

env:
  # Global configuration
  DEPLOYMENT_USER: 'deploy'
  DEPLOYMENT_PATH: 'app-backend-deploy'
  ARCHIVE_NAME: 'deploy.tar.gz'

permissions:
  contents: read

jobs:
  # Validate deployment request
  validate:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
      branch: ${{ steps.validate.outputs.branch }}
    steps:
      - name: Validate deployment parameters
        id: validate
        run: |
          # CHANGED: Always use the current branch
          BRANCH="${{ github.ref_name }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          # If environment is not set (e.g., push trigger), default to sandbox
          if [[ -z "$ENVIRONMENT" ]]; then
            # ENVIRONMENT="sandbox"
            # echo "⚠️  No environment specified, using default: sandbox"
            echo "❌ environment is not set"
            exit 1
          fi
          
          # Production deployments must be from main/master branch
          if [[ "$ENVIRONMENT" == "production" && "$BRANCH" != "main" ]]; then
            echo "❌ Production deployments must be from main"
            echo "   Current branch: $BRANCH"
            exit 1
          fi
          
          echo "✅ Validation passed"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          # Summary
          echo "📋 Deployment will proceed with:"
          echo "   Environment: $ENVIRONMENT"
          echo "   Branch: $BRANCH"

  # Main deployment job
  deploy:
    name: Deploy to ${{ needs.validate.outputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ needs.validate.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.validate.outputs.environment }}
      cancel-in-progress: false
    outputs:
      deploy-thread-ts: ${{ steps.slack-deploy-start.outputs.ts }}

    steps:
      # Step 1: Load Slack secrets (only for staging/production deploys)
      - name: Load Slack secrets
        id: slack-secrets
        if: needs.validate.outputs.environment == 'staging' || needs.validate.outputs.environment == 'production'
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 #v4.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          SLACK_BOT_TOKEN: "op://kv_backend2_infra/SLACK_BOT_TOKEN/credential"
          SLACK_CHANNEL_ID: "op://kv_backend2_infra/SLACK_CHANNEL_ID/credential"

      # Step 2: Configure deployment environment
      - name: Configure deployment environment
        id: configure
        run: |
          ENVIRONMENT="${{ needs.validate.outputs.environment }}"
          
          # Debug: Show what we received
          echo "Received environment: '$ENVIRONMENT'"
          
          # Map environment names to deployment codes
          case "$ENVIRONMENT" in
            "production")
              DEPLOY_ENV="prod"
              ;;
            "staging")
              DEPLOY_ENV="stg"
              ;;
            "development")
              DEPLOY_ENV="dev"
              ;;
            "sandbox")
              DEPLOY_ENV="sand"
              ;;
            *)
              echo "❌ Unknown environment: $ENVIRONMENT"
              exit 1
              ;;
          esac
          
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # Set 1Password configuration based on environment
          if [[ "$ENVIRONMENT" == "production" ]]; then
            OP_VAULT="apikeys_production"
            echo "OP_VAULT=apikeys_production" >> $GITHUB_ENV
          else
            OP_VAULT="apikeys_nonprod"
            echo "OP_VAULT=apikeys_nonprod" >> $GITHUB_ENV
          fi

          # Set server configuration paths
          echo "OP_SERVER_USERNAME=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/username" >> $GITHUB_ENV
          echo "OP_SERVER_URL=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/URL" >> $GITHUB_ENV
          echo "OP_SERVER_CERT=op://${OP_VAULT}/backend2_server_${DEPLOY_ENV}/deploy_backend2_${DEPLOY_ENV}" >> $GITHUB_ENV
          
          echo "📋 Deployment Configuration:"
          echo "   Environment: $ENVIRONMENT"
          echo "   Deploy Code: $DEPLOY_ENV"
          echo "   Branch: ${{ needs.validate.outputs.branch }}"

      # Step 2: Install required tools
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 #v4.1.0

      # Step 3: Load server connection secrets
      - name: Load server connection secrets
        id: server-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 #v4.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ needs.validate.outputs.environment == 'production' && secrets.OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP || secrets.OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP }}
          SERVER_USERNAME: ${{ env.OP_SERVER_USERNAME }}
          SERVER_URL: ${{ env.OP_SERVER_URL }}

      # Step 4: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.branch }}
          fetch-depth: 0  # Full history for better debugging

      # Step 5: Extract release thread for production deploys
      - name: Get release body
        id: release-body
        if: needs.validate.outputs.environment == 'production'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh release view --json body -q .body 2>/dev/null || echo "")
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            echo "body<<$DELIM"
            echo "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release Slack thread
        id: release-thread
        if: needs.validate.outputs.environment == 'production'
        uses: ./.github/actions/extract-slack-ts
        with:
          text: ${{ steps.release-body.outputs.body }}

      # Step 7: Generate changelog for staging deploys
      - name: Setup Node.js
        if: needs.validate.outputs.environment == 'staging'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Find previous staging deployment SHA
        id: prev-deploy
        if: needs.validate.outputs.environment == 'staging'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Pick most recent staging deployment whose SHA isn't this run's SHA
          PREV_SHA=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=staging&per_page=10" \
            --jq "[.[] | select(.sha != \"${{ github.sha }}\")] | .[0].sha" 2>/dev/null || echo "")

          if [[ -n "$PREV_SHA" && "$PREV_SHA" != "null" ]]; then
            echo "Previous staging deploy SHA: $PREV_SHA"
            echo "PREV_DEPLOY_SHA=$PREV_SHA" >> "$GITHUB_ENV"
          else
            echo "No previous staging deployment found; falling back to last release tag"
          fi

          # Fetch main so the changelog can exclude already-released commits
          # (staging often pulls in old commits via merge-from-main; without this
          # filter they'd surface as fake "new" changes).
          git fetch --no-tags --quiet origin main || true

      - name: Generate release summary
        id: changelog
        if: needs.validate.outputs.environment == 'staging'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          SUMMARY=$(node .github/workflows/scripts/generateReleaseSummary.js)

          # Compute pre-release version from last tag + pending commit types
          if [[ -n "$LAST_TAG" ]]; then
            COMPARE="<https://github.com/aragon/app-backend/compare/${LAST_TAG}...${SHORT_SHA}|Compare with ${LAST_TAG}>"
            # Parse semver from tag (e.g. v0.23.1 -> 0 23 1)
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            # Check if there are feat commits (minor bump) or only fix (patch bump)
            if git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:%s | grep -qiE '^feat[\s(:]'; then
              NEXT_VERSION="v$MAJOR.$((MINOR + 1)).0-pre"
            else
              NEXT_VERSION="v$MAJOR.$MINOR.$((PATCH + 1))-pre"
            fi
          else
            COMPARE=""
            NEXT_VERSION="v0.1.0-pre"
          fi

          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            echo "summary<<$DELIM"
            echo "$SUMMARY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"
          echo "next-version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # Step 8: Notify Slack - Deploy Started
      - name: Notify Slack - Deploy Started
        id: slack-deploy-start
        if: steps.slack-secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.slack-secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.slack-secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ steps.release-thread.outputs.ts }}
          message: |
            :rocket: *Backend ${{ steps.changelog.outputs.next-version && format('{0} ', steps.changelog.outputs.next-version) || '' }}deploying to ${{ needs.validate.outputs.environment }}...*
            Branch: `${{ needs.validate.outputs.branch }}`
            Triggered by: ${{ github.actor }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

      # Step 9: Post changelog for staging (so team knows what to test)
      - name: Notify Slack - Staging Changelog
        if: needs.validate.outputs.environment == 'staging' && steps.slack-deploy-start.outputs.ts != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.slack-secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.slack-secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ steps.slack-deploy-start.outputs.ts }}
          message: |
            :clipboard: *Changes to test:*

            ${{ steps.changelog.outputs.summary }}

            ${{ steps.changelog.outputs.compare }}

      # Step 10: Setup SSH authentication
      - name: Setup SSH authentication
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ needs.validate.outputs.environment == 'production' && secrets.OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP || secrets.OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP }}
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Download SSH private key
          op read "${{ env.OP_SERVER_CERT }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Configure SSH
          cat > ~/.ssh/config <<EOF
          Host deployment-server
            HostName ${{ steps.server-secrets.outputs.SERVER_URL }}
            User ${{ steps.server-secrets.outputs.SERVER_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          
          # Test SSH connection
          ssh deployment-server "echo '✅ SSH connection established'"

      # Step 9: Download application configurations
      - name: Download application configurations
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_TEMP }}
        run: |
          echo "📥 Downloading configuration files..."
          
          # Create scripts to handle config downloads
          cat > download_configs.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          VAULT="temporal_backend2"
          ITEM="configs_app_backend2_$DEPLOY_ENV"
          
          # Download application configs
          echo "📄 Downloading application configurations..."
          op item get --vault "$VAULT" "$ITEM" --format json | \
            jq -r '.fields.[].label' | sed 1d | \
            while IFS= read -r config_name; do
              echo "  - Processing: $config_name"
          
              # Download config content
              op item get --vault "$VAULT" "$ITEM" --fields "$config_name" | \
                sed '1s/^"//;$s/"$//' > temp_config
          
              # Split semicolon-separated configs
              IFS=';' read -ra CONFIGS <<< "$config_name"
              for conf in "${CONFIGS[@]}"; do
                CONFIG_FILE=".env.$conf-$DEPLOY_ENV"
                cp temp_config "$CONFIG_FILE"
          
                # Update environment-specific values
                case "$DEPLOY_ENV" in
                  prod)  LOGZIO_ENV="PRODUCTION" ;;
                  stg)   LOGZIO_ENV="STAGING" ;;
                  sand)  LOGZIO_ENV="SANDBOX" ;;
                  *)     LOGZIO_ENV="DEVELOPMENT" ;;
                esac
          
                sed -i "s/^LOGZIO_SERVER_NAME=.*/LOGZIO_SERVER_NAME=${conf^^}-${LOGZIO_ENV}/" "$CONFIG_FILE"
                echo "    ✓ Created $CONFIG_FILE ($(sha256sum "$CONFIG_FILE" | cut -d' ' -f1 | head -c 8))"
              done
          
              rm temp_config
            done
          
          # Download Docker configuration
          echo "📄 Downloading Docker configuration..."
          op item get --vault "$VAULT" "configs_docker" --fields "docker-config" | \
            sed '1s/^"//;$s/"$//' > .env.docker
          
          if [[ ! -s .env.docker ]]; then
            echo "❌ ERROR: Docker configuration not found"
            exit 1
          fi
          
          echo "✅ Configuration download complete"
          SCRIPT
          
          chmod +x download_configs.sh
          ./download_configs.sh

      # Step 10: Deploy to server
      - name: Deploy to server
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          echo "🚀 Starting deployment to ${{ needs.validate.outputs.environment }}..."
          
          # Show current directory and files
          echo "📁 Current directory: $(pwd)"
          echo "📄 All .env files in current directory:"
          ls -la .env* | head -20
          
          # Move up one directory to create tar
          cd ..
          
          # Show files that will be included in tar
          echo ""
          echo "📁 Directory to be archived: $REPO_NAME"
          echo "📄 All .env files to be included in archive:"
          ls -la "$REPO_NAME"/.env* | head -20
          
          # Create tar archive of the entire repository
          echo "📦 Creating deployment archive..."
          tar -czf deploy.tar.gz "$REPO_NAME"
          
          # Verify tar contents
          echo "📋 Verifying .env files in archive:"
          tar -tzf deploy.tar.gz | grep "\.env" | head -20
          
          # Transfer the archive to remote server
          echo "📤 Transferring deployment archive..."
          scp deploy.tar.gz deployment-server:~/
          
          # Execute deployment on remote server
          echo "🚀 Executing deployment on remote server..."
          ssh deployment-server bash -s "$REPO_NAME" "$DEPLOY_ENV" << 'EOF'
          REPO_NAME=$1
          DEPLOY_ENV=$2
          set -e
          
          # Extract the archive
          echo "📦 Extracting deployment archive..."
          tar -xzf ~/deploy.tar.gz
          rm ~/deploy.tar.gz
          
          # Remove old deployment
          echo "🧹 Cleaning up old deployment..."
          rm -rf ~/app-backend-deploy
          
          # Rename extracted directory
          mv ~/"$REPO_NAME" ~/app-backend-deploy
          
          # Navigate to deployment directory
          cd ~/app-backend-deploy
          
          # List all env files to verify they exist
          echo "📄 All .env files in deployment directory:"
          ls -la .env* | head -20
          
          # Make scripts executable
          chmod +x scripts/*.sh
          
          # Export environment variables
          export ENV_SUFFIX="$DEPLOY_ENV"
          export DEPLOY_ENV="$DEPLOY_ENV"
          
          # CREATE DOCKER NETWORK BEFORE RUNNING THE DEPLOYMENT SCRIPT
          echo "🔧 Ensuring Docker network exists on remote server..."
          docker network create internal-net 2>/dev/null || true
          docker network create public-net 2>/dev/null || true
          
          # Run the Docker deployment script
          echo "🎯 Executing Docker deployment for environment: $ENV_SUFFIX"
          bash scripts/app-deploy.sh "$ENV_SUFFIX"
          
          echo "✅ Deployment completed successfully!"
          EOF
          
          # Cleanup local archive
          rm deploy.tar.gz || true

      # Step 11: Verify deployment health
      - name: Verify deployment health
        run: |
          echo "🏥 Verifying deployment health..."

          # Basic health check
          ssh deployment-server << 'HEALTH_CHECK'
          set -euo pipefail

          cd ~/app-backend-deploy

          # Check if containers are running
          echo "🐳 Checking Docker containers..."
          docker ps --filter "label=app=backend2" --filter "status=running" --format "table {{.Names}}\t{{.Status}}"

          # Add more health checks as needed
          echo "✅ Health check passed"
          HEALTH_CHECK

      # Step 12: Cleanup sensitive data
      - name: Cleanup sensitive data
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive data..."

          # Remove SSH keys and configs
          rm -rf ~/.ssh/deploy_key ~/.ssh/config

          # Remove configuration files
          rm -f .env* download_configs.sh

          # Clear environment variables
          unset OP_SERVICE_ACCOUNT_TOKEN

          echo "✅ Cleanup complete"

      # Step 13: Notify Slack - Deploy Result
      - name: Notify Slack - Deploy Result
        if: always() && steps.slack-secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.slack-secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.slack-secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ steps.slack-deploy-start.outputs.ts }}
          message: |
            ${{ job.status == 'success' && ':white_check_mark: *Backend deploy to' || ':x: *Backend deploy to' }} ${{ needs.validate.outputs.environment }} ${{ job.status }}*
            Branch: `${{ needs.validate.outputs.branch }}`
            ${{ job.status == 'success' && format('Deployed by: {0}', github.actor) || format('Attempted by: {0}', github.actor) }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

      # Step 14: Fallback webhook notification (remove after Bot Token is verified)
      - name: Fallback - Webhook notification
        if: always() && (needs.validate.outputs.environment == 'staging' || needs.validate.outputs.environment == 'production') && steps.slack-secrets.outputs.SLACK_BOT_TOKEN == ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
        run: |
          STATUS="${{ job.status }}"
          ENVIRONMENT="${{ needs.validate.outputs.environment }}"
          BRANCH="${{ needs.validate.outputs.branch }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "$ENVIRONMENT" == "production" ]]; then
            SLACK_URL=$(op read "op://kv_backend2_infra/slack_hook_prod/credential")
          else
            SLACK_URL=$(op read "op://kv_backend2_infra/slack_hook_nonprod/credential")
          fi

          if [[ "$STATUS" == "success" ]]; then
            MESSAGE=$(printf ':white_check_mark: Backend Deployment successful!\nEnvironment: %s\nBranch: %s\nDeployed by: %s\nDetails: %s' \
              "$ENVIRONMENT" "$BRANCH" "$ACTOR" "$RUN_URL")
          else
            MESSAGE=$(printf ':x: Backend Deployment failed!\nEnvironment: %s\nBranch: %s\nAttempted by: %s\nDetails: %s' \
              "$ENVIRONMENT" "$BRANCH" "$ACTOR" "$RUN_URL")
          fi

          jq -n --arg text "$MESSAGE" '{ text: $text }' | \
            curl -s -X POST \
              -H 'Content-type: application/json; charset=utf-8' \
              -d @- \
              "$SLACK_URL"

  # Run E2E tests after deployment
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: success()

    steps:
      - name: Checkout for composite actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            .github/workflows/scripts

      - name: Set deployment environment
        run: |
          ENVIRONMENT="${{ needs.validate.outputs.environment }}"

          # Map to deployment code
          case "$ENVIRONMENT" in
            "production") DEPLOY_ENV="prod" ;;
            "staging") DEPLOY_ENV="stg" ;;
            "development") DEPLOY_ENV="dev" ;;
            "sandbox") DEPLOY_ENV="sand" ;;
          esac

          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV

      - name: Trigger E2E test suite
        uses: aragon/app-qa/.github/actions/dispatch@5954adf802c2577f6d63df5b118acbd74ff8bbf0 # main @ 2025-12-22 (no tagged releases upstream)
        with:
          opToken: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_APP_NEXT_QA }}
          environment: ${{ env.DEPLOY_ENV }}

      - name: Load Slack secrets
        id: slack-secrets
        if: needs.deploy.outputs.deploy-thread-ts != ''
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 #v4.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          SLACK_BOT_TOKEN: "op://kv_backend2_infra/SLACK_BOT_TOKEN/credential"
          SLACK_CHANNEL_ID: "op://kv_backend2_infra/SLACK_CHANNEL_ID/credential"

      - name: Notify Slack - E2E Triggered
        if: needs.deploy.outputs.deploy-thread-ts != '' && steps.slack-secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.slack-secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.slack-secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.deploy.outputs.deploy-thread-ts }}
          message: ':test_tube: E2E tests triggered for ${{ needs.validate.outputs.environment }}'

      - name: Report E2E test status
        run: |
          echo "🧪 E2E tests triggered for ${{ needs.validate.outputs.environment }} environment (code: ${{ env.DEPLOY_ENV }})"