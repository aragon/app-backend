name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - development
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REPO_URL: git@github.com:${{ github.repository }}.git
      BRANCH_NAME: ${{ github.ref_name }}

    steps
    # 1) Compute DEPLOY_ENV and all vault paths+token-names
    - name: Set variables
      id: set-vars
      shell: bash
      run: |
        BRANCH=${GITHUB_REF##*/}
        case "$BRANCH" in
          main)        ENV_SUFFIX=prod; VAULT_NS=apikeys_production;  SA_SERV=OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP;   ;;
          staging)     ENV_SUFFIX=stg;  VAULT_NS=apikeys_nonprod;     SA_SERV=OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP ;;
          development) ENV_SUFFIX=dev;  VAULT_NS=apikeys_nonprod;     SA_SERV=OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP ;;
          test)        ENV_SUFFIX=test; VAULT_NS=apikeys_nonprod;     SA_SERV=OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP ;;
          *)           ENV_SUFFIX=dev;  VAULT_NS=apikeys_nonprod;     SA_SERV=OP_SERVICE_ACCOUNT_TOKEN_NONPROD_TEMP ;;
        esac
        
        echo "ENV_SUFFIX=${ENV_SUFFIX}"                                  >> $GITHUB_ENV
        echo "OP_SERVICE_ACCOUNT_VAR_NAME_SERVERS=${SA_SERV}"             >> $GITHUB_ENV
        echo "OP_SERVICE_ACCOUNT_VAR_NAME_CONFIGS=OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_TEMP" >> $GITHUB_ENV
        
        echo "OP_SERVER_USERNAME=op://${VAULT_NS}/backend2_server_${ENV_SUFFIX}/username" >> $GITHUB_ENV
        echo "OP_SERVER_URL=     op://${VAULT_NS}/backend2_server_${ENV_SUFFIX}/URL"      >> $GITHUB_ENV
        echo "OP_SERVER_CERT=    op://${VAULT_NS}/backend2_server_${ENV_SUFFIX}/deploy_backend2_${ENV_SUFFIX}" >> $GITHUB_ENV

    # 2) Checkout code
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # 3) Fetch server creds (user & host) from 1Password
    - name: Load server username & host
      id: server-creds
      uses: 1password/load-secrets-action@v2
      with:
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[ env.OP_SERVICE_ACCOUNT_VAR_NAME_SERVERS ] }}
        SERVER_USERNAME:         ${{ env.OP_SERVER_USERNAME }}
        SERVER_URL:              ${{ env.OP_SERVER_URL }}

    # 4) Install the 1Password CLI
    - name: Install 1Password CLI
      uses: 1password/install-cli-action@v1
      with:
        version: latest-beta

    # 5) Download SSH key and start ssh-agent
    - name: Download SSH key & configure SSH
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[ env.OP_SERVICE_ACCOUNT_VAR_NAME_SERVERS ] }}
        SERVER_CERT:              ${{ env.OP_SERVER_CERT }}
      run: |
        mkdir -p ~/.ssh
        echo "🔐 Reading SSH key from $SERVER_CERT"
        op read "$SERVER_CERT" > ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
        
        # start ssh-agent & add key
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa
        
        # trust the server fingerprint
        ssh-keyscan -H "${{ steps.server-creds.outputs.SERVER_URL }}" >> ~/.ssh/known_hosts

    # 6) Download your service .env files (with LOGZIO tweaks)
    - name: Download config files
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets[ env.OP_SERVICE_ACCOUNT_VAR_NAME_CONFIGS ] }}
        OP_VAULT:                 temporal_backend2
        OP_VAULT_ITEM:            configs_app_backend2_${{ env.ENV_SUFFIX }}
      run: |
        echo "🔐 Fetching configs for $OP_VAULT_ITEM"
        ITEM_JSON=$(op item get --vault "$OP_VAULT" "$OP_VAULT_ITEM" --format json)
        
        echo "$ITEM_JSON" \
          | jq -c '.fields[] | select(.value? and (.value | test("APP_NAME=")))' \
          | while read -r field; do
              LABELS=$(jq -r '.label' <<<"$field")
              CONFIG=$(jq -r '.value' <<<"$field")
              IFS=';' read -ra SERVICES <<<"$LABELS"
              for svc in "${SERVICES[@]}"; do
                [[ -n "$svc" ]] || continue
                f=".env.${svc}-${ENV_SUFFIX}"
                echo "Creating $f"
                echo "$CONFIG" > "$f"
                UPPER=$(tr '[:lower:]' '[:upper:]' <<<"$svc" | tr '-' '_')
                # replicate your LOGZIO sed logic
                sed -i "s/^LOGZIO_SERVER_NAME=.*/LOGZIO_SERVER_NAME=${UPPER^^}-${ENV_SUFFIX^^} /" "$f"
              done
            done

    # 7) (Optional) print out the mapping
    - name: Print branch/env map
      run: echo "Deploying branch $BRANCH_NAME → env suffix ${{ env.ENV_SUFFIX }}"

    # 8) Rsync & remote deploy via your existing script
    - name: Rsync & remote deploy
      shell: bash
      run: |
        TARGET="${{ steps.server-creds.outputs.SERVER_USERNAME }}@${{ steps.server-creds.outputs.SERVER_URL }}"
        echo "📤 Rsyncing to $TARGET:/srv/${{ env.ENV_SUFFIX }}/"
        rsync -avz --exclude='.git' --exclude='node_modules' \
          ./ "$TARGET:/srv/${{ env.ENV_SUFFIX }}/"

        echo "🔍 Checking if RabbitMQ is healthy on remote..."

        ssh "$TARGET" <<EOF
          set -e
          cd /srv/${{ env.ENV_SUFFIX }}/

          CONTAINER_NAME="rabbitmq-${{ env.ENV_SUFFIX }}"
          STATUS=\$(docker inspect -f '{{ .State.Health.Status }}' "\$CONTAINER_NAME" 2>/dev/null || echo "not_found")

          if [ "\$STATUS" = "healthy" ]; then
            echo "✅ RabbitMQ is healthy, deploying only services"
            bash scripts/app-deploy.sh ${{ env.ENV_SUFFIX }} services
          else
            echo "⚠️ RabbitMQ is not healthy or not found (\$STATUS), deploying everything"
            bash scripts/app-deploy.sh ${{ env.ENV_SUFFIX }} all
          fi
        EOF

    # 9) Reset env vars (cleanup)
    - name: Reset env vars
      run: |
        echo "OP_SERVER_USERNAME="               >> $GITHUB_ENV
        echo "OP_SERVER_URL="                    >> $GITHUB_ENV
        echo "OP_SERVER_CERT="                   >> $GITHUB_ENV
        echo "OP_SERVICE_ACCOUNT_VAR_NAME_SERVERS=" >> $GITHUB_ENV
        echo "OP_SERVICE_ACCOUNT_VAR_NAME_CONFIGS=" >> $GITHUB_ENV

    # 10) Dispatch E2E tests
    - name: Dispatch E2E tests
      uses: aragon/app-qa/.github/actions/dispatch@main
      with:
        opToken:   ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PROD_TEMP }}
        environment: ${{ env.ENV_SUFFIX }}
