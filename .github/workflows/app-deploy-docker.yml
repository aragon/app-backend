name: Docker Deployment
run-name: Docker deployment to ${{ github.event_name == 'push' && 'sandbox' || inputs.environment }}

# ──────────────────────────────────────────────────────────────────────────
# Manual / out-of-cycle deploy of the branch this workflow is dispatched from
# (`github.ref_name`) to one environment, through the same deploy-reusable.yml
# the release flow uses — same gates (staging / production pause on their
# Environment approval), same Slack ceremony (a manual deploy opens its own
# thread). Production deploys only from main. A push to `sandbox` deploys it to sandbox.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - sandbox
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment server'
        required: true
        type: choice
        options:
          - sandbox
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment parameters
        env:
          BRANCH: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.event_name == 'push' && 'sandbox' || inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" == "production" && "$BRANCH" != "main" ]]; then
            echo "❌ Production deployments must be from main (current branch: $BRANCH)" >&2
            exit 1
          fi
          echo "📋 Deploying $BRANCH to $ENVIRONMENT"

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'push' && 'sandbox' || inputs.environment }}
      ref: ${{ github.ref_name }}
