name: Release — PR (test + staging)
run-name: Release PR #${{ github.event.pull_request.number }} — test + staging

# ──────────────────────────────────────────────────────────────────────────
# Runs on release/* and hotfix/* PRs into `main`:
#   1. fast checks (lint, format, unit + coverage) and the staging deploy run in
#      PARALLEL — merge is gated by the required checks (Approve #2), the deploy by
#      the staging Environment's Required-reviewers rule (Approve #1)
#   2. release/* PRs also regenerate the summary in the PR body + Slack root
#      message (refresh-summary) and rebuild the CHANGELOG.md section
#      (regen-changelog) on every push
#   3. post "what to test" + non-blocking E2E into the Slack thread
#
# Only the fast checks live here: unit-dep + integration are required checks for
# merge via their own workflows on the same PR, and duplicating the
# docker-compose-test infra before staging would buy nothing.
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Least privilege: only refresh-summary edits the PR body, so it carries the write
# scope at job level and every other job here runs on a read-only token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  meta:
    if: >
      startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      thread-ts: ${{ steps.ts.outputs.ts }}
      release-actor: ${{ steps.actor.outputs.actor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Get PR body
        id: body
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json body -q .body > pr_body.txt
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          { echo "body<<$DELIM"; cat pr_body.txt; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
      - name: Extract Slack thread ts
        id: ts-raw
        uses: ./.github/actions/extract-slack-ts
        with:
          text: ${{ steps.body.outputs.body }}
      # A Slack ts is a unix timestamp and this release's root message is posted right after
      # the PR opens, so a marker older than the PR belongs to another release — drop
      # threading rather than let chat.update rewrite that release's message.
      - name: Validate the Slack thread marker
        id: ts
        env:
          TS: ${{ steps.ts-raw.outputs.ts }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          set -euo pipefail
          if [ -z "$TS" ]; then
            echo "ts=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CREATED=$(node -p 'Math.floor(Date.parse(process.env.PR_CREATED_AT) / 1000)')
          if [ "${TS%%.*}" -lt "$CREATED" ]; then
            echo "::warning::Ignoring slack_ts $TS — it predates the PR, so it is not this release's root message."
            echo "ts=" >> "$GITHUB_OUTPUT"
          else
            echo "ts=$TS" >> "$GITHUB_OUTPUT"
          fi
      # refresh-summary rewrites the whole root message, where `github.actor` is whoever
      # pushed last — so release-start's attribution is carried in the body, not re-derived.
      - name: Extract release actor
        id: actor
        env:
          BODY: ${{ steps.body.outputs.body }}
        run: |
          set -euo pipefail
          ACTOR=$(printf '%s\n' "$BODY" \
            | sed -nE 's@^[[:space:]]*<!-- release_actor: ([A-Za-z0-9_.-]+) -->[[:space:]]*$@\1@p' \
            | head -n 1)
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

  test:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit:coverage
      - run: pnpm test:coverage:check

  # Keeps the PR body and the Slack root message reflecting the branch, not the snapshot
  # release-start took — including the open-tickets warning.
  # release/* only: hotfix PR bodies are authored by hotfix-start, not generated.
  # synchronize only: on `opened` there is nothing to refresh yet, and the run would race
  # release-start's body edit and rewrite it before the slack_ts marker lands, losing the
  # Slack thread for the rest of the release.
  refresh-summary:
    if: github.event.action == 'synchronize' && startsWith(github.event.pull_request.head.ref, 'release/')
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Trusted code at the workspace root: scripts and composite actions are taken
      # from the PR's BASE commit, never from the release branch. This job reads
      # 1Password tokens below, and anyone able to push to release/* could otherwise
      # swap the very code that handles them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/actions
            .github/workflows/scripts
      # The release branch is checked out as git DATA only — the summary and the
      # migration flag are derived from its history, no code from it is executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the summary range starts at the latest release tag.
          fetch-depth: 0
          path: pr
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          LINEAR_API_TOKEN: op://kv_backend2_infra/LINEAR_API_TOKEN/credential
          SLACK_BOT_TOKEN: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
          SLACK_CHANNEL_ID: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      # Same flag release-start puts into the root message; re-detected here so the
      # chat.update rewrite doesn't drop it.
      - name: Detect DB migrations in this release (flag only)
        id: migrations
        working-directory: pr
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && git diff --name-only "$LAST_TAG"..HEAD | grep -qiE 'migration'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted script, release-branch history: the script derives everything from
      # `git` in the working directory, so it reads the branch without running it.
      - name: Regenerate release summary
        id: summary
        working-directory: pr
        env:
          LINEAR_API_TOKEN: ${{ steps.secrets.outputs.LINEAR_API_TOKEN }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.github/workflows/scripts/generateReleaseSummary.js" > "$GITHUB_WORKSPACE/summary.md"
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            echo "summary<<$DELIM"
            cat "$GITHUB_WORKSPACE/summary.md"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      # Both markers are re-appended: they are this release's only cross-run state
      # (Slack thread id and the actor release-start attributed the release to).
      - name: Update PR body (preserving release markers)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THREAD_TS: ${{ needs.meta.outputs.thread-ts }}
          RELEASE_ACTOR: ${{ needs.meta.outputs.release-actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$THREAD_TS" ]; then
            printf '\n\n<!-- slack_ts: %s -->\n' "$THREAD_TS" >> summary.md
          fi
          if [ -n "$RELEASE_ACTOR" ]; then
            printf '<!-- release_actor: %s -->\n' "$RELEASE_ACTOR" >> summary.md
          fi
          gh pr edit "$PR_NUMBER" --body-file summary.md
      - name: Update Slack root message
        if: needs.meta.outputs.thread-ts != '' && steps.secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.secrets.outputs.SLACK_CHANNEL_ID }}
          update-ts: ${{ needs.meta.outputs.thread-ts }}
          message: |
            :rocket: *Backend Release v${{ needs.meta.outputs.version }} Started*
            *PR:* ${{ github.event.pull_request.html_url }}
            Branch: `${{ github.event.pull_request.head.ref }}`${{ needs.meta.outputs.release-actor != '' && format(' · by {0}', needs.meta.outputs.release-actor) || '' }}
            ${{ steps.migrations.outputs.has == 'true' && ':warning: *Contains DB migrations* — roll-forward only' || '' }}

            ${{ steps.summary.outputs.summary }}

  # Keeps CHANGELOG.md — and the GitHub Release notes finalize extracts from it —
  # matching what actually ships: commits landing on the release branch after
  # release-start are otherwise never reflected in the changelog.
  # The in-flight section is rebuilt from scratch (latest tag → HEAD), so manual
  # edits to it do NOT survive the next push; commits with non-conventional
  # subjects are dropped by the generator — fix the subject, or hand-edit only
  # after the final push.
  # synchronize only, mirroring refresh-summary: the `opened` head is
  # release-start's own commit, which already carries a fresh changelog.
  regen-changelog:
    if: github.event.action == 'synchronize' && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      # The release branch is git DATA here, like in refresh-summary: nothing
      # from it is executed — the changelog CLI is installed pinned from the
      # public registry, outside the checkout so a project .npmrc cannot
      # redirect the install, and only reads package.json + git history.
      # No credentials exist in the job until after it has run: the checkout
      # persists none, and secrets/GPG load in the later steps.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the changelog range starts at the latest release tag,
          # and the reset below needs the merge-base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate CHANGELOG.md
        id: regen
        env:
          # head.ref and base.ref are attacker-influenceable text (GitHub lists
          # branch names as an injection source) — they reach the shell only via
          # env, never by template interpolation, and are shape-checked before use.
          RELEASE_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_REF" | grep -qE '^release/[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Unexpected release ref shape: $RELEASE_REF" >&2
            exit 1
          fi
          if ! printf '%s' "$BASE_REF" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "❌ Unexpected base ref shape: $BASE_REF" >&2
            exit 1
          fi
          # Reset the file to its state at the release branch's fork point so
          # the generator rebuilds the whole in-flight section instead of
          # prepending a duplicate one. The fork point is used rather than the
          # last tag: it keeps changelog fixes merged to the base after that
          # tag, and it exists even when the tag is not backmerged yet.
          FORK_POINT=$(git merge-base "origin/$BASE_REF" HEAD)
          if git cat-file -e "$FORK_POINT:CHANGELOG.md" 2>/dev/null; then
            git show "$FORK_POINT:CHANGELOG.md" > CHANGELOG.md
          fi
          # Same CLI + preset as release-start; the section header version comes
          # from the package.json already bumped on this branch.
          (cd "$RUNNER_TEMP" && npm install --no-save --registry https://registry.npmjs.org conventional-changelog-cli@5.0.0)
          "$RUNNER_TEMP/node_modules/.bin/conventional-changelog" -p conventionalcommits -i CHANGELOG.md -s -r 1
          # A no-op diff is also what terminates the recursion: the regen push
          # below re-runs this job once, which then regenerates to no change.
          if git diff --quiet -- CHANGELOG.md; then
            echo "✅ CHANGELOG.md already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Load secrets
        id: secrets
        if: steps.regen.outputs.changed == 'true'
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          GPG_PASSPHRASE: op://kv_backend2_infra/arabot-1_SIGN_CERTS/credential
          GPG_PRIVATE_KEY: op://kv_backend2_infra/arabot-1_SIGN_CERTS/private_key
          GITHUB_RELEASE_TOKEN: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      - name: Import GPG key
        if: steps.regen.outputs.changed == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ steps.secrets.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      # Pushed with the release PAT so the required checks re-run on the new
      # head (a plain GITHUB_TOKEN push would leave them stuck pending).
      - name: Commit & push
        if: steps.regen.outputs.changed == 'true'
        env:
          RELEASE_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          git commit -m "chore(release): regenerate changelog"
          # No force: if the branch moved while this ran, the rejected push is
          # fine — the newer push has its own regen run.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            push origin "HEAD:$RELEASE_REF"

  # The "waiting Approve #1" gate ping comes from deploy-reusable (notify-gate), so it
  # fires for manual deploys too and is not duplicated here.
  deploy-staging:
    needs: meta
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: staging
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.meta.outputs.version }}
      slack-thread-ts: ${{ needs.meta.outputs.thread-ts }}

  e2e:
    needs: [meta, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            .github/workflows/scripts
      - name: Trigger E2E (non-blocking)
        continue-on-error: true
        uses: aragon/app-qa/.github/actions/dispatch@5954adf802c2577f6d63df5b118acbd74ff8bbf0 # main @ 2025-12-22 (no tagged releases upstream)
        with:
          opToken: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_APP_NEXT_QA }}
          environment: stg
      - name: Load Slack secrets
        id: secrets
        if: needs.meta.outputs.thread-ts != ''
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          SLACK_BOT_TOKEN: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
          SLACK_CHANNEL_ID: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      - name: Notify Slack — E2E triggered
        if: needs.meta.outputs.thread-ts != '' && steps.secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.meta.outputs.thread-ts }}
          message: ':test_tube: E2E tests triggered for staging (non-blocking)'
