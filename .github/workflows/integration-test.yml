name: Integration Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'development'
      - 'staging'
      - 'main'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1
        with:
          version: latest-beta

      - name: Load DRPC key from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_TEMP }}
        run: |
          DRPC_KEY=$(op read "op://temporal_backend2/dRCP_backend2/integration_test")
          echo "DEBUG_KEY=${DRPC_KEY}"
          echo "::add-mask::${DRPC_KEY}"
          echo "ETH_RPC_URL=https://lb.drpc.org/ogrpc?network=ethereum&dkey=${DRPC_KEY}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: yarn install

      - name: Verify ETH_RPC_URL
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "❌ ETH_RPC_URL is not set"
            exit 1
          fi
          echo "✅ ETH_RPC_URL is set"

      - name: Start integration infra
        run: yarn docker:integration

      - name: Run integration tests
        run: yarn test:integration

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose-integration.yml down -v
