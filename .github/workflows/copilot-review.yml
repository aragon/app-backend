name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'development'
      - 'staging'
      - 'main'

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run GitHub Copilot for PRs
        uses: github/copilot-for-prs@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.ARABOT_PAT }}
