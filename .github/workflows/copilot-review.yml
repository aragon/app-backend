name: Copilot Review

on:
  pull_request:
    branches:
      - 'development'
      - 'staging'
      - 'main'

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Instead of using the copilot-for-prs action directly,
      # use the GitHub API to request a review
      - name: Request Copilot Review
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ARABOT_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/requests" \
            -d '{"team_reviewers":[],"reviewers":["github-actions"]}'
