name: Production deploy
run-name: Production deploy ${{ github.event.release.tag_name || inputs.tag }}

# ──────────────────────────────────────────────────────────────────────────
# Triggered by a published GitHub Release (from release-finalize) or manually
# with a tag (hotfix / re-deploy / rollback target). Deploys behind the CI Gate
# (production Environment protection), runs non-blocking E2E, then opens the
# idempotent main → development back-merge PR.
#
# ── SHADOW MODE ────────────────────────────────────────────────────────────
# Deploys to `sandbox` and SKIPS the back-merge. Also listens to `prereleased`
# so the shadow prerelease from release-finalize exercises this end-to-end.
#   # TODO(flip): deploy env sandbox → production; SHADOW=false;
#   #             trigger types → [published]; back-merge arms automatically.
# ──────────────────────────────────────────────────────────────────────────

on:
  release:
    # Publishing a prerelease emits BOTH `prereleased` and `published`, so
    # listening to both double-fires this workflow. Shadow uses prereleases, so
    # listen only to `prereleased`. # TODO(flip): [published]
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)deploy to production
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SHADOW: 'true' # TODO(flip): 'false'

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      thread-ts: ${{ steps.info.outputs.ts }}
    steps:
      - name: Resolve tag / version / Slack thread
        id: info
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          VERSION=$(echo "$TAG" | sed 's/^shadow-//; s/^v//')
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || echo "")
          TS=$(echo "$BODY" | grep -oE '<!-- slack_ts: [0-9.]+ -->' | grep -oE '[0-9.]+' | head -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ts=$TS" >> "$GITHUB_OUTPUT"

  # Announce the gate BEFORE deploy-prod pauses on the production Environment
  # protection (the CI Gate). Runs in parallel with deploy-prod — NOT via
  # needs: — so that skipping it (no Slack thread) never cancels the deploy.
  notify-gate:
    needs: meta
    if: needs.meta.outputs.thread-ts != ''
    runs-on: ubuntu-latest
    steps:
      - name: Load Slack secrets
        id: secrets
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          SLACK_BOT_TOKEN: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
          SLACK_CHANNEL_ID: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      - name: Notify Slack — waiting CI Gate (production deploy)
        if: steps.secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.meta.outputs.thread-ts }}
          message: |
            :double_vertical_bar: *Waiting CI Gate — deploy to production*
            Approve the production deploy: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>

  deploy-prod:
    needs: meta
    # SHADOW: sandbox. # TODO(flip): sandbox → production (arms the CI Gate).
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: sandbox
      ref: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
      slack-thread-ts: ${{ needs.meta.outputs.thread-ts }}

  e2e:
    needs: [meta, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            .github/actions
            .github/workflows/scripts
      - name: Trigger E2E (non-blocking)
        continue-on-error: true
        uses: aragon/app-qa/.github/actions/dispatch@5954adf802c2577f6d63df5b118acbd74ff8bbf0 # main @ 2025-12-22 (no tagged releases upstream)
        with:
          opToken: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_APP_NEXT_QA }}
          environment: sand # SHADOW. # TODO(flip): → prod
      - name: Load Slack secrets
        id: secrets
        if: needs.meta.outputs.thread-ts != ''
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          SLACK_BOT_TOKEN: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
          SLACK_CHANNEL_ID: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      - name: Notify Slack — E2E + release complete
        if: needs.meta.outputs.thread-ts != '' && steps.secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.secrets.outputs.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.meta.outputs.thread-ts }}
          message: |
            :tada: *Backend Release v${{ needs.meta.outputs.version }} complete*
            :test_tube: E2E triggered for production (non-blocking)

  back-merge:
    needs: [meta, deploy-prod]
    # SHADOW: run even if the sandbox deploy-prod failed, so the back-merge can be
    # exercised on its own. # TODO(flip): tighten to needs.deploy-prod.result == 'success'.
    if: ${{ always() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          GITHUB_RELEASE_TOKEN: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      - name: Open idempotent back-merge PR (main → development)
        env:
          # Release PAT — the back-merge PR also hits CODEOWNERS
          # (@aragon/app-team auto-requested); the token needs org `read:org`.
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          # This job has no checkout, so gh can't infer the repo from a .git dir.
          # GH_REPO lets `gh pr list/create/edit` work without a working tree.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # SHADOW: exercise the back-merge against the throwaway test branches
          # (test-release plays "main", test/development plays "development").
          # TODO(flip): drop the shadow arm — BASE=development, HEAD=main.
          if [ "${SHADOW:-false}" = "true" ]; then
            BASE="test/development"; HEAD="test-release"
          else
            BASE="development"; HEAD="main"
          fi
          echo "Back-merge: $HEAD → $BASE"
          TITLE="chore: sync $HEAD (v${{ needs.meta.outputs.version }}) back to $BASE"
          BODY="Auto-generated after release v${{ needs.meta.outputs.version }}. Includes CHANGELOG.md update."
          EXISTING_PR=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
            echo "Updated existing back-merge PR #$EXISTING_PR"
          elif OUT=$(gh pr create --base "$BASE" --head "$HEAD" --title "$TITLE" --body "$BODY" 2>&1); then
            echo "$OUT"
          else
            echo "$OUT"
            # No diff or a PR already exists → nothing to do, not a failure.
            echo "$OUT" | grep -qiE 'No commits between|already exists' \
              && { echo "$BASE already in sync with $HEAD — nothing to back-merge"; exit 0; }
            exit 1
          fi
