name: Production deploy
run-name: Production deploy ${{ github.event.release.tag_name || inputs.tag }}

# ──────────────────────────────────────────────────────────────────────────
# Triggered by a published GitHub Release (from the release finalize) or manually
# with a tag (hotfix / re-deploy / rollback target). Deploys behind the CI Gate
# (production Environment protection) and triggers the non-blocking E2E; the
# release thread (found through the release body) hears every step, and a
# published release ends with the head message flipped to Completed and the
# Linear release marked complete.
#
# NOTE: the main → development back-merge is NOT here — it lives in
# release-backmerge.yml, triggered the moment the PR merges into main, so a
# finalize/release failure can never block it.
# ──────────────────────────────────────────────────────────────────────────

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)deploy to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Resolve tag / version
        id: info
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$RAW_TAG" | sed 's/^shadow-//; s/^v//')" >> "$GITHUB_OUTPUT"

  # Deploys to production; the CI Gate = the production Environment's Required-reviewers rule,
  # which pauses this job until approval. The gate ping, the result and the thread come from
  # deploy-reusable.
  deploy-prod:
    needs: meta
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: production
      ref: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
      slack-thread-release-tag: ${{ needs.meta.outputs.tag }}

  e2e:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Trigger E2E (non-blocking)
        continue-on-error: true
        uses: aragon/app-qa/.github/actions/dispatch@5954adf802c2577f6d63df5b118acbd74ff8bbf0 # main @ 2025-12-22 (no tagged releases upstream)
        with:
          opToken: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_APP_NEXT_QA }}
          environment: prod

  e2e-notify:
    needs: [meta, e2e]
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: message
      message: '🧪 E2E tests triggered for production (non-blocking)'
      thread-release-tag: ${{ needs.meta.outputs.tag }}
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}

  # A manual re-deploy of an older tag is not a release completing.
  complete:
    needs: [meta, deploy-prod]
    if: github.event_name == 'release'
    uses: aragon/github-templates/.github/workflows/release-complete.yml@main
    with:
      tag: ${{ needs.meta.outputs.tag }}
      env: production
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_backend2_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-pipeline-key-path: op://kv_backend2_infra/LINEAR_PIPELINE_ACCESS_KEY/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
