name: Sandbox Rebuild

on:
  push:
    branches: [development]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and report only, push nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sandbox-label-merge
  queue: max
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'sandbox' &&
       (github.event.label.name == 'Sandbox' ||
        (contains(fromJSON('["synchronize", "reopened", "closed"]'), github.event.action) &&
         contains(github.event.pull_request.labels.*.name, 'Sandbox'))))
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          GPG_PASSPHRASE: op://kv_backend2_infra/arabot-1_SIGN_CERTS/credential
          GPG_PRIVATE_KEY: op://kv_backend2_infra/arabot-1_SIGN_CERTS/private_key
          GITHUB_RELEASE_TOKEN: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential

      - name: Checkout development
        uses: actions/checkout@v7
        with:
          token: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          ref: development
          fetch-depth: 0

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ steps.secrets.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Rebuild sandbox
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash .github/scripts/sandbox-rebuild.sh
