name: Release — Start
run-name: Start release (base ${{ inputs.base_commit || github.ref_name }})

# ──────────────────────────────────────────────────────────────────────────
# Manually-triggered or scheduled (auto release every Monday ~5:30PM CET).
# Computes the next version from conventional commits,
# creates release/x.y.z from development, commits the version bump + CHANGELOG
# (reviewable in the PR), opens the PR → main, and starts the Slack thread.
#
# This workflow does NOT deploy and does NOT tag.
#
# Opens the release PR against TARGET_BRANCH = `main`. release-finalize owns the
# tag + GitHub Release on merge; the legacy semantic-release on push:main is
# retired (see release.yml).
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Auto release: every Monday at 14:37 UTC (~16:37 CEST in summer, 15:37 CET
    # in winter — the cron is fixed in UTC, no DST handling). Off :00/:30
    # because GitHub delays or drops schedules queued at popular minutes.
    # Scheduled runs execute on the default branch, so the release bases off
    # `development` — same as a manual run without inputs.
    - cron: '37 14 * * 1'
  workflow_dispatch:
    inputs:
      base_commit:
        description: 'Commit/branch to start the release from (default: the branch this workflow is run on)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-start
  cancel-in-progress: false

env:
  TARGET_BRANCH: main

jobs:
  # Gates scheduled runs only (manual dispatch bypasses it): green-skips when
  # there is nothing to release or something is still in flight — unlike the
  # in-job guards below, which fail the run loudly on the manual path.
  schedule-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate scheduled run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip() { echo "⏭️ Skipping auto release: $1"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }

          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          [ "${OPEN:-0}" -eq 0 ] || skip "a release PR is already open."

          # An open back-merge PR (main → development) means the previous
          # release is not fully synced back yet — starting from a stale
          # `development` would mis-compute the version.
          BACKMERGE=$(gh pr list --repo "$GITHUB_REPOSITORY" --base development --head main --state open \
            --json number --jq 'length')
          [ "${BACKMERGE:-0}" -eq 0 ] || skip "the back-merge PR (main → development) is not merged yet."

          # Back-merge is in (checked above), so the latest tag is reachable
          # from development — any commit on top of it is something to release.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NEW_COMMITS=$(git rev-list --count ${LAST_TAG:+$LAST_TAG..}HEAD)
          [ "$NEW_COMMITS" -gt 0 ] || skip "no new commits since ${LAST_TAG:-repo start}."

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  start:
    needs: schedule-gate
    # !cancelled() lets workflow_dispatch runs proceed past the skipped gate.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.schedule-gate.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
          GPG_PASSPHRASE: op://kv_backend2_infra/arabot-1_SIGN_CERTS/credential
          GPG_PRIVATE_KEY: op://kv_backend2_infra/arabot-1_SIGN_CERTS/private_key
          GITHUB_RELEASE_TOKEN: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
          SLACK_BOT_TOKEN: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
          SLACK_CHANNEL_ID: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
          LINEAR_API_TOKEN: op://kv_backend2_infra/LINEAR_API_TOKEN/credential

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          token: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          ref: ${{ inputs.base_commit || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Guard — only one active release
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list --base "$TARGET_BRANCH" --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("release/"))] | length')
          if [ "${OPEN:-0}" -ne 0 ]; then
            echo "❌ An active release PR already exists — only one active release at a time." >&2
            gh pr list --base "$TARGET_BRANCH" --state open --json number,headRefName \
              -q '.[] | select(.headRefName|startswith("release/")) | "  #\(.number) \(.headRefName)"' >&2 || true
            exit 1
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ steps.secrets.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Compute next version (semantic-release dry-run)
        id: version
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
          BASE_INPUT: ${{ inputs.base_commit || github.ref_name }}
        run: |
          set -euo pipefail
          BASE="$BASE_INPUT"
          # semantic-release only runs on configured branches; override --branches
          # so the dry-run computes the next version from this base.
          # NOTE: re-validate this log parse whenever semantic-release is upgraded —
          # the "next release version is X.Y.Z" line format can change across majors.
          # Write the dry-run log outside the working tree so it doesn't leave an
          # untracked file that trips pnpm's clean-tree check in the bump step.
          pnpm exec semantic-release --dry-run --branches "$BASE" > "$RUNNER_TEMP/sr.log" 2>&1 || true
          VERSION=$(grep -oiE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/sr.log" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not determine next version from semantic-release dry-run." >&2
            echo "   (No releasable commits, or output format changed.)" >&2
            tail -n 50 "$RUNNER_TEMP/sr.log" >&2 || true
            exit 1
          fi
          # Guard against stale tag lineage: if BASE diverged from the production
          # tag line (e.g. a history rewrite, or main never back-merged into it),
          # semantic-release baselines on an old tag and computes a version BELOW
          # what's already released. Fail loudly instead of opening a bogus PR.
          LATEST=$(git tag --list --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -n "$LATEST" ] && [ "$VERSION" != "$LATEST" ] && \
             [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "❌ Computed v$VERSION ≤ latest tag v$LATEST — base '$BASE' tag lineage is stale." >&2
            echo "   Back-merge main into '$BASE' (so it descends from v$LATEST), then retry." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Next version: v$VERSION"

      - name: Create release branch
        id: branch
        run: |
          set -euo pipefail
          BR="release/${{ steps.version.outputs.version }}"
          git checkout -b "$BR"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        run: pnpm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Update CHANGELOG.md
        # conventionalcommits preset matches our commit convention; prepends the
        # new section (header version comes from the just-bumped package.json).
        run: pnpm dlx conventional-changelog-cli -p conventionalcommits -i CHANGELOG.md -s -r 1

      - name: Generate release summary (Slack / PR body)
        id: summary
        env:
          LINEAR_API_TOKEN: ${{ steps.secrets.outputs.LINEAR_API_TOKEN }}
        run: |
          set -euo pipefail
          node .github/workflows/scripts/generateReleaseSummary.js > summary.md
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            echo "summary<<$DELIM"
            cat summary.md
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Detect DB migrations in this release (flag only)
        id: migrations
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && git diff --name-only "$LAST_TAG"..HEAD | grep -qiE 'migration'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        run: |
          set -euo pipefail
          # Only the release artifacts — never `git add -A`, which would sweep in
          # the sr.log / summary.md scratch files generated by earlier steps.
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          # A leftover release branch from a cancelled/failed start has no open PR
          # (the one-active-release guard ran above), so overwrite it cleanly.
          git push --force origin "${{ steps.branch.outputs.name }}"

      - name: Create PR → main
        id: pr
        env:
          # Release PAT (ARABOT_APP_BACKEND_RELEASES). MUST have org `read:org`:
          # CODEOWNERS auto-requests @aragon/app-team and gh reads the reviewer
          # back — without org read it fails with "Resource not accessible by
          # personal access token (...reviewRequests.nodes.0.requestedReviewer)".
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(gh pr create --base "$TARGET_BRANCH" --head "${{ steps.branch.outputs.name }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --body-file summary.md)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=$(gh pr view "$URL" --json number -q .number)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack — Release Started (root message)
        id: slack
        if: steps.secrets.outputs.SLACK_BOT_TOKEN != ''
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ steps.secrets.outputs.SLACK_CHANNEL_ID }}
          message: |
            :rocket: *Backend Release v${{ steps.version.outputs.version }} Started*
            *PR:* ${{ steps.pr.outputs.url }}
            Branch: `${{ steps.branch.outputs.name }}` · by ${{ github.actor }}
            ${{ steps.migrations.outputs.has == 'true' && ':warning: *Contains DB migrations* — roll-forward only' || '' }}

            ${{ steps.summary.outputs.summary }}

      - name: Embed slack_ts in PR body
        if: steps.slack.outputs.ts != ''
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh pr view ${{ steps.pr.outputs.number }} --json body -q .body > body.md
          printf '\n\n<!-- slack_ts: %s -->\n' "${{ steps.slack.outputs.ts }}" >> body.md
          gh pr edit ${{ steps.pr.outputs.number }} --body-file body.md
