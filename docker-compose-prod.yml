services:
  # --------------------------------------------------
  # MongoDB Replica Set
  # --------------------------------------------------
  mongo1:
    image: registry.cn-qingdao.aliyuncs.com/freechain/mongodb:8.0
    container_name: mongo1
    hostname: mongo1
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - cddao-internal-net

  mongo2:
    image: registry.cn-qingdao.aliyuncs.com/freechain/mongodb:8.0
    container_name: mongo2
    hostname: mongo2
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - cddao-internal-net

  mongo3:
    image: registry.cn-qingdao.aliyuncs.com/freechain/mongodb:8.0
    container_name: mongo3
    hostname: mongo3
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - cddao-internal-net

  mongo-init-replica:
    image: registry.cn-qingdao.aliyuncs.com/freechain/mongodb:8.0
    container_name: mongo-init-replica
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    entrypoint: /bin/bash
    command: >
      -c "
      echo 'Waiting a few seconds for MongoDB nodes to be ready...';
      sleep 5;
      echo 'Initializing replica set...';
      mongosh --host mongo1:27017 --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo1:27017\" },
            { _id: 1, host: \"mongo2:27017\" },
            { _id: 2, host: \"mongo3:27017\" }
          ]
        });
      ';
      echo 'Replica set initialized.'
      "
    networks:
      - cddao-internal-net

  rabbitmq:
    image: registry.cn-qingdao.aliyuncs.com/freechain/rabbitmq:3.9-management-alpine
    container_name: rabbitmq-${ENV_SUFFIX}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}'               # AMQP port
      - '${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}'    # HTTP management UI
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net

  migration:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-migration:${ENV_SUFFIX}
    container_name: service-migration-${ENV_SUFFIX}
    env_file:
      - .env.aragon-indexer-${ENV_SUFFIX} # Use the same env file as the indexer
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: bash -c "yarn wait:rabbitmq && yarn mig:run && echo 'Migration Service completed'"
    restart: "no"  # Don't restart after completion
    networks:
      - cddao-internal-net

  # --------------------------------------------------
  # Microservices
  # --------------------------------------------------
  service-aragon-api:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-api:${ENV_SUFFIX}
    container_name: service-aragon-api-${ENV_SUFFIX}
    ports:
      - '${SERVICES_API_PORT}:${SERVICES_API_PORT}'
    env_file:
      - .env.aragon-api-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-api"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${SERVICES_API_PORT}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-admin-api:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-admin-api:${ENV_SUFFIX}
    container_name: service-aragon-admin-api-${ENV_SUFFIX}
    ports:
      - '${SERVICES_ADMIN_API_PORT}:${SERVICES_ADMIN_API_PORT}'
    env_file:
      - .env.aragon-admin-api-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-admin-api"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${SERVICES_ADMIN_API_PORT}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-indexer:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-indexer:${ENV_SUFFIX}
    container_name: service-aragon-indexer-${ENV_SUFFIX}
    env_file:
      - .env.aragon-indexer-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-indexer"
    healthcheck:
      test: ['CMD-SHELL', "pgrep -f 'service:aragon-indexer' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-dao:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-dao:${ENV_SUFFIX}
    container_name: service-aragon-dao-${ENV_SUFFIX}
    env_file:
      - .env.aragon-dao-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-dao"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-dao' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-gateway:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-gateway:${ENV_SUFFIX}
    container_name: service-aragon-gateway-${ENV_SUFFIX}
    env_file:
      - .env.aragon-gateway-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-gateway"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-gateway' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-plugins:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-plugins:${ENV_SUFFIX}
    env_file:
      - .env.aragon-plugins-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-plugins"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-plugins' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net
    deploy:
      replicas: 2

  service-aragon-rates:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-rates:${ENV_SUFFIX}
    container_name: service-aragon-rates-${ENV_SUFFIX}
    env_file:
      - .env.aragon-rates-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-rates"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-rates' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

  service-aragon-requeue:
    image: registry.cn-qingdao.aliyuncs.com/freechain/cddao-service-aragon-requeue:${ENV_SUFFIX}
    container_name: service-aragon-requeue-${ENV_SUFFIX}
    env_file:
      - .env.aragon-requeue-${ENV_SUFFIX}
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-requeue"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-requeue' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cddao-internal-net
      - cddao-public-net

networks:
  cddao-internal-net:
    external: true
    name: cddao-internal-net
  cddao-public-net:
    external: true
    name: cddao-public-net

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
