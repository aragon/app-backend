minimumReleaseAge: 10080 # cooldown period for new packages in minutes (7 days)
minimumReleaseAgeExclude:
  - fast-uri # security fix 3.1.5 (GHSA host-confusion), published 2026-07-31
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # skip trust checks for packages published >3 months ago

#npm settings
savePrefix: ^
strictPeerDependencies: true
autoInstallPeers: false
sideEffectsCache: true
preferFrozenLockfile: true
dedupePeerDependents: true
ignoreScripts: true
autoInstallTypes: true
nodeVersion: 24.16.0
engineStrict: true

# pnpm overrides
overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  axios@<1.18.0: ^1.18.0
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  diff@>=6.0.0 <8.0.3: '>=8.0.3'
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  follow-redirects@<1.16.0: '>=1.16.0'
  form-data@<2.5.6: ^2.5.6
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  handlebars@<4.7.9: ^4.7.9
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  lodash-es@<4.18.1: ^4.18.1
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  postcss@<8.5.23: ^8.5.23
  qs@<6.15.2: ^6.15.2
  undici@<6.28.0: ^6.28.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  serialize-javascript@<7.0.5: ^7.0.5
  uuid@<11.1.1: ^11.1.1
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
