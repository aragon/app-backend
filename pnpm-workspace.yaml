minimumReleaseAge: 10080 # cooldown period for new packages in minutes (7 days)
minimumReleaseAgeExclude:
  - js-yaml # security fix 3.15.1/4.3.1 (CVE-2026-59870 omap cpu), published 2026-07-31
  - multer@2.5.0
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # skip trust checks for packages published >3 months ago

#npm settings
savePrefix: ^
strictPeerDependencies: true
autoInstallPeers: false
sideEffectsCache: true
preferFrozenLockfile: true
dedupePeerDependents: true
ignoreScripts: true
autoInstallTypes: true
nodeVersion: 24.22.1
engineStrict: true

# pnpm overrides
overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  axios@<1.20.0: ^1.20.0
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=4.0.0 <5.0.12: '5.0.12'
  browserslist@<4.28.7: ^4.28.7
  diff@>=6.0.0 <8.0.3: '>=8.0.3'
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  follow-redirects@<1.16.1: '1.16.1'
  form-data@<2.5.6: ^2.5.6
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  handlebars@<4.7.10: ^4.7.10
  js-yaml@<3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  lodash-es@<4.18.1: ^4.18.1
  moment@<2.31.0: '2.31.0'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  postcss@<8.5.23: ^8.5.23
  qs@<6.16.0: ^6.16.0
  undici@<6.29.1: ^6.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
